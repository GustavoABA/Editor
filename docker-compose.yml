services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: opencut
      POSTGRES_PASSWORD: opencut
      POSTGRES_DB: opencut
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencut"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  serverless-redis-http:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8079:80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        - FREESOUND_CLIENT_ID=${FREESOUND_CLIENT_ID}
        - FREESOUND_API_KEY=${FREESOUND_API_KEY}
        - NEXT_PUBLIC_MARBLE_API_URL=${NEXT_PUBLIC_MARBLE_API_URL:-https://api.marblecms.com}
        - MARBLE_WORKSPACE_KEY=${MARBLE_WORKSPACE_KEY:-build-placeholder}
    restart: unless-stopped
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://opencut:opencut@db:5432/opencut
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - UPSTASH_REDIS_REST_URL=http://serverless-redis-http:80
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}
      - NEXT_PUBLIC_MARBLE_API_URL=https://api.marblecms.com
      - MARBLE_WORKSPACE_KEY=${MARBLE_WORKSPACE_KEY:-placeholder}
      - FREESOUND_CLIENT_ID=${FREESOUND_CLIENT_ID}
      - FREESOUND_API_KEY=${FREESOUND_API_KEY}
      - RENDER_JOBS_DIR=/app/render-jobs
      - LAN_SYNC_DIR=/app/lan-sync
      - LAN_SYNC_TOKEN=${OPENCUT_LAN_SYNC_TOKEN:-}
      - LAN_SYNC_MAX_ASSET_BYTES=${LAN_SYNC_MAX_ASSET_BYTES:-17179869184}
      - LAN_SYNC_MAX_PROJECT_BYTES=${LAN_SYNC_MAX_PROJECT_BYTES:-68719476736}
      - LAN_SYNC_MAX_CHECKPOINTS=${LAN_SYNC_MAX_CHECKPOINTS:-120}
      - PARAKEET_SERVICE_URL=http://parakeet:8707
      - PARAKEET_INTERNAL_TOKEN=${PARAKEET_INTERNAL_TOKEN:-}
      - MCP_NGROK_AGENT_URL=http://ngrok:4040/api
      - CHROMIUM_PATH=/usr/bin/chromium-browser
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - AUTOCUT_PATH=/usr/local/bin/opencut-autocut
      - AUTOMATION_DIR=/app/automation
      - OPENCUT_AUTOMATION_TOKEN=${BETTER_AUTH_SECRET}
      - N8N_BASE_URL=http://host.docker.internal:5678
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - LOCAL_AI_BASE_URL=http://local-ai:8080/v1
      - LOCAL_AI_MODEL=qwen2.5-coder-0.5b-instruct-q4_k_m.gguf
      - MCP_HTTP_URL=http://mcp-http:3101
    # CLI runs on-demand inside the web container. tmpfs presents enough
    # free space to the official renderer preflight (does not preallocate 4GiB).
    tmpfs:
      - /tmp:size=4g,mode=1777
    volumes:
      - render_jobs_v2:/app/render-jobs
      - lan_sync_data:/app/lan-sync
      - automation_data:/app/automation
    depends_on:
      db:
        condition: service_healthy
      serverless-redis-http:
        condition: service_healthy
      local-ai:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/api/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      # Set this to the host's LAN IP or local DNS name so Caddy presents a
      # certificate for the address clients actually use.
      - OPENCUT_LAN_HOST=${OPENCUT_LAN_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  # Embedded, CPU-only fallback: model and runtime belong to the Editor
  # deployment. It is intentionally not exposed outside this Docker network.
  local-ai:
    build:
      context: ./services/local-ai
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["-m", "/models/hyperframes-fallback.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "2048", "-ngl", "0", "--parallel", "1"]
    expose:
      - "8080"
    mem_limit: 900m

  mcp:
    profiles: ["tools"]
    build:
      context: ./apps/mcp
      dockerfile: Dockerfile
    environment:
      - OPENCUT_BASE_URL=http://web:3000
      - OPENCUT_AUTOMATION_TOKEN=${BETTER_AUTH_SECRET}
    stdin_open: true
    depends_on:
      web:
        condition: service_healthy

  mcp-http:
    build:
      context: ./apps/mcp
      dockerfile: Dockerfile
    command: ["bun", "src/http.ts"]
    restart: unless-stopped
    ports:
      - "3101:3101"
    environment:
      - PORT=3101
      - OPENCUT_BASE_URL=http://web:3000
      - OPENCUT_AUTOMATION_TOKEN=${BETTER_AUTH_SECRET}
    depends_on:
      web:
        condition: service_healthy

  # Agent runs with no public tunnel; the editor's authenticated UI creates
  # and destroys only the MCP endpoint on demand. Never publish port 4040.
  ngrok:
    profiles: ["mcp-tunnel"]
    image: ngrok/ngrok:3-alpine
    restart: unless-stopped
    command: ["start", "--none", "--config", "/etc/ngrok.yml"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    volumes:
      - ./services/ngrok/ngrok.yml:/etc/ngrok.yml:ro
    expose:
      - "4040"

  # Optional CPU-only Parakeet Redux service; not exposed on the public host.
  parakeet:
    profiles: ["transcription"]
    build:
      context: ./services/parakeet
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PARAKEET_INTERNAL_TOKEN=${PARAKEET_INTERNAL_TOKEN:-}
    expose:
      - "8707"
    volumes:
      - parakeet_models:/models

  # Optional, isolated browser-based importer. It runs only when explicitly
  # enabled with `docker compose --profile importer up -d importer`.
  # No Docker socket is mounted: the editor cannot start or control containers.
  importer:
    profiles: ["importer"]
    # Pin the application version so a new upstream image cannot silently
    # change the editor's download workflow. Update intentionally after tests.
    image: ghcr.io/justayden/ytdl-ui:2.5.0
    restart: unless-stopped
    environment:
      - YTDLUI_HOST=0.0.0.0
      - YTDLUI_PORT=5000
      - YTDLUI_TRUST_PROXY=1
      - YTDLUI_PROCESSING_MODE=server
      - YTDLUI_MAX_CONCURRENT_JOBS=${IMPORTER_MAX_CONCURRENT_JOBS:-1}
      - YTDLUI_MAX_FILESIZE_MB=${IMPORTER_MAX_FILESIZE_MB:-2048}
      - YTDLUI_MAX_DURATION_MINUTES=${IMPORTER_MAX_DURATION_MINUTES:-180}
      - YTDLUI_ALLOWED_SITES=${IMPORTER_ALLOWED_SITES:-}
      - YTDLUI_PASSWORD=${IMPORTER_PASSWORD:-}
    expose:
      - "5000"
    volumes:
      - importer_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.environ.get('YTDLUI_PORT','5000'), timeout=4)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  parakeet_models:
  importer_data:
  postgres_data:
  render_jobs_v2:
  lan_sync_data:
  automation_data:
  caddy_data:
  caddy_config:

networks:
  default:
    name: opencut-network
