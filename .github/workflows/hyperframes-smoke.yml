name: HyperFrames Native CLI Smoke

on:
  push:
    branches: [teste/implementacao]
    paths:
      - 'services/hyperframes/**'
      - 'apps/web/Dockerfile'
      - '.github/workflows/hyperframes-smoke.yml'
  workflow_dispatch:

jobs:
  native-render-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate CLI wrapper syntax
        run: node --check services/hyperframes/server.mjs
      - name: Build native HyperFrames CLI for Alpine
        run: docker build --tag opencut-hyperframes-native-smoke ./services/hyperframes
      - name: Check HTML/CSS sanitization and seek-runtime contract
        run: docker run --rm --network none --entrypoint node \
          opencut-hyperframes-native-smoke --test render.test.mjs
      - name: Render using one-shot CLI (no daemon or HTTP service)
        run: |
          mkdir -p "$RUNNER_TEMP/hyperframes-native"
          chmod 777 "$RUNNER_TEMP/hyperframes-native"
          cat > "$RUNNER_TEMP/hyperframes-native/input.json" <<'EOF'
          {"html":"<h1 class='title'>HyperFrames Test</h1>","css":".title{color:#fff2a6;position:absolute;top:20px;left:20px;font-size:48px;font-family:Arial}","width":640,"height":360,"duration":0.5,"fps":24}
          EOF
          chmod 644 "$RUNNER_TEMP/hyperframes-native/input.json"
          docker run --rm --read-only --network none \
            --tmpfs /tmp:rw,size=4g --memory 1536m \
            -v "$RUNNER_TEMP/hyperframes-native:/out" \
            opencut-hyperframes-native-smoke \
            /out/input.json /out/hyperframes-overlay.webm
          test "$(wc -c <"$RUNNER_TEMP/hyperframes-native/hyperframes-overlay.webm")" -gt 500
          test "$(od -An -tx1 -N4 "$RUNNER_TEMP/hyperframes-native/hyperframes-overlay.webm" | tr -d ' \\n')" = "1a45dfa3"
