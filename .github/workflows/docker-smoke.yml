name: Docker production smoke

on:
  push:
    branches: [main, teste/implementacao]
    paths:
      - "apps/web/**"
      - "apps/mcp/**"
      - "rust/crates/autocut/**"
      - "services/hyperframes/**"
      - "services/local-ai/**"
      - "services/parakeet/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - "features.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docker-smoke.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/mcp/**"
      - "rust/crates/autocut/**"
      - "services/hyperframes/**"
      - "services/local-ai/**"
      - "services/parakeet/**"
      - "docker-compose.yml"
      - "Caddyfile"
      - "features.md"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/docker-smoke.yml"

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BETTER_AUTH_SECRET: docker-smoke-secret-only-at-least-32-characters
      UPSTASH_REDIS_REST_TOKEN: docker-smoke-redis-token
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      OPENCUT_LAN_HOST: editor.lan
      NEXT_PUBLIC_MARBLE_API_URL: https://api.marblecms.com
      MARBLE_WORKSPACE_KEY: build-placeholder
      FREESOUND_CLIENT_ID: placeholder
      FREESOUND_API_KEY: placeholder
      OPENCUT_LAN_SYNC_TOKEN: docker-smoke-lan-token-over-16-characters
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --profile importer config --quiet

      - name: Build production image and embedded AI fallback
        run: docker compose build web local-ai parakeet mcp-http

      - name: Start required services
        run: docker compose up -d db redis serverless-redis-http local-ai web parakeet mcp-http

      - name: Wait for the Editor health endpoint
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          exit 1

      - name: Verify Cut Editor public routes
        run: |
          curl --fail --silent http://127.0.0.1:3100/ > /tmp/editor-home.html
          grep -q 'GustavoABA/Editor' /tmp/editor-home.html
          curl --fail --silent http://127.0.0.1:3100/roadmap > /tmp/editor-roadmap.html
          grep -q 'F10' /tmp/editor-roadmap.html
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/blog)" = 404

      - name: Validate local AI readiness
        run: |
          for attempt in $(seq 1 40); do
            if docker compose exec -T web node -e "fetch('http://local-ai:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Verify MCP scoped authentication and initialize
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3101/health >/dev/null; then break; fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3101/mcp)" = 401
          token=$(python3 -c 'import os,hmac,hashlib; print(hmac.new(os.environ["BETTER_AUTH_SECRET"].encode(),b"cut-editor:mcp-external:v1",hashlib.sha256).hexdigest())')
          curl --fail --silent --show-error --max-time 20 -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}' \
            http://127.0.0.1:3101/mcp > /tmp/editor-mcp-init
          grep -q '"serverInfo"' /tmp/editor-mcp-init

      - name: Verify CPU transcription end to end
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          espeak-ng -v pt-br -w /tmp/editor-speech.wav "Olá mundo. Este é um teste de legenda."
          for attempt in $(seq 1 40); do
            if curl --fail --silent -H "x-lan-sync-token: $OPENCUT_LAN_SYNC_TOKEN" http://127.0.0.1:3100/api/transcription/parakeet | grep -q '"available":true'; then
              break
            fi
            sleep 3
          done
          curl --fail --silent --show-error --max-time 610 \
            -H "x-lan-sync-token: $OPENCUT_LAN_SYNC_TOKEN" \
            -H "x-transcription-engine: whisper" \
            -H "x-transcription-language: pt" \
            -H "Content-Type: audio/wav" --data-binary @/tmp/editor-speech.wav \
            http://127.0.0.1:3100/api/transcription/parakeet > /tmp/editor-transcript.json
          python3 -c 'import json; d=json.load(open("/tmp/editor-transcript.json")); assert d["engine"].startswith("faster-whisper/") and d["segments"] and all(s["end"] >= s["start"] for s in d["segments"])'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3100/api/transcription/parakeet)" = 401

      - name: Validate Caddy configuration and trusted LAN HTTPS
        run: |
          docker compose up -d caddy
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          for attempt in $(seq 1 40); do
            if docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt /tmp/editor-lan-root.crt && curl --fail --silent --show-error --noproxy '*' --cacert /tmp/editor-lan-root.crt --resolve editor.lan:443:127.0.0.1 https://editor.lan/api/health; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200

      - name: Stop smoke-test services
        if: always()
        run: docker compose down --volumes --remove-orphans
