name: F13 Stable promotion (guarded)
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful main candidate workflow run ID
        required: true
        type: string
      data_schema:
        description: Audited backward-compatible data schema identifier
        required: true
        type: string
      rollback_approved:
        description: Native host restoration and schema compatibility independently verified
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: f13-stable-promotion
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main' && vars.F13_STABLE_ENABLED == 'true' && inputs.rollback_approved
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
      BETTER_AUTH_SECRET: ci-only-not-a-production-secret
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      OPENCUT_LAN_SYNC_TOKEN: ci-lan-placeholder-not-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      FREESOUND_CLIENT_ID: placeholder
      FREESOUND_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Validate trusted candidate provenance and exact-main CI
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > /tmp/run.json
          python3 -c 'import json,os; d=json.load(open("/tmp/run.json")); assert d["name"]=="F13 Docker multiarch candidates" and d["head_sha"]==os.environ["GITHUB_SHA"] and d["head_branch"]=="main" and d["head_repository"]["full_name"]==os.environ["GITHUB_REPOSITORY"] and d["event"] in ("push","workflow_dispatch") and d["conclusion"]=="success"'
          gh run download "$CANDIDATE_RUN" --name f13-candidate-manifest --dir candidate
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=100" --jq .workflow_runs > /tmp/ci.json
          docker compose --profile '*' config --format json > /tmp/compose.json
          python3 deploy/mobile/release_gate.py validate --candidate candidate/candidate.json --sha "$GITHUB_SHA" --ci /tmp/ci.json --compose /tmp/compose.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-candidate
          path: candidate/candidate.json

  native-smoke:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      BETTER_AUTH_SECRET: ci-only-not-a-production-secret
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      OPENCUT_LAN_SYNC_TOKEN: ci-lan-placeholder-not-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      OPENCUT_LAN_HOST: editor.lan
      FREESOUND_CLIENT_ID: placeholder
      FREESOUND_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-candidate
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run exact candidate images
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("candidate.json"))
          mapping={"web":"web","mcp-http":"mcp","local-ai":"local-ai","parakeet":"parakeet"}
          json.dump({"services":{k:{"image":d["images"][v]} for k,v in mapping.items()}},open("candidate-compose.json","w"))
          PY
          docker compose -f docker-compose.yml -f candidate-compose.json pull
          docker compose -f docker-compose.yml -f candidate-compose.json up -d --no-build --pull never --wait --wait-timeout 240
          curl --fail --silent --show-error http://127.0.0.1:3100/api/health
          curl --fail --silent --show-error http://127.0.0.1:3101/health
          docker compose -f docker-compose.yml -f candidate-compose.json exec -T web node -e "Promise.all(['http://local-ai:8080/health','http://parakeet:8707/health'].map(u=>fetch(u))).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))"
          docker compose -f docker-compose.yml -f candidate-compose.json exec -T db pg_isready -U opencut
          docker compose -f docker-compose.yml -f candidate-compose.json exec -T redis redis-cli ping
      - name: Verify basic Portuguese CPU transcription on exact images
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          espeak-ng -v pt-br -w /tmp/speech.wav "Olá mundo. Este é um teste de legenda."
          curl --fail --silent --show-error --max-time 610 -H "x-lan-sync-token: $OPENCUT_LAN_SYNC_TOKEN" -H "x-transcription-engine: whisper" -H "x-transcription-language: pt" -H "Content-Type: audio/wav" --data-binary @/tmp/speech.wav http://127.0.0.1:3100/api/transcription/parakeet > /tmp/transcript.json
          python3 -c 'import json; d=json.load(open("/tmp/transcript.json")); assert d["engine"].startswith("faster-whisper/") and d["segments"]'
      - if: failure()
        run: docker compose -f docker-compose.yml -f candidate-compose.json logs --tail=100
      - if: always()
        run: |
          if test -f candidate-compose.json; then
            docker compose -f docker-compose.yml -f candidate-compose.json down --volumes --remove-orphans
          fi

  publish:
    needs: [gate, native-smoke]
    runs-on: ubuntu-latest
    environment: f13-stable
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_KEY: ${{ secrets.F13_RELEASE_SIGNING_KEY }}
      DATA_SCHEMA: ${{ inputs.data_schema }}
      CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
      BETTER_AUTH_SECRET: ci-only-not-a-production-secret
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      OPENCUT_LAN_SYNC_TOKEN: ci-lan-placeholder-not-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3100
      FREESOUND_CLIENT_ID: placeholder
      FREESOUND_API_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-candidate
      - name: Prepare signed stable release from exact candidate
        run: |
          test -n "$RELEASE_KEY"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=100" --jq .workflow_runs > /tmp/ci.json
          docker compose --profile '*' config --format json > /tmp/compose.json
          sequence=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" --jq .run_number)
          python3 deploy/mobile/release_gate.py prepare --candidate candidate.json --sha "$GITHUB_SHA" --ci /tmp/ci.json --compose /tmp/compose.json --sequence "$sequence" --data-schema "$DATA_SCHEMA" --approved
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_KEY" > "$key"
          openssl dgst -sha256 -sign "$key" -out cut-editor-stable.sig cut-editor-stable.json
          tag="cut-editor-stable-$sequence"
          # Create draft with both assets before making it visible to the monitor.
          gh release create "$tag" cut-editor-stable.json cut-editor-stable.sig --draft --target "$GITHUB_SHA" --title "Cut Editor stable $sequence" --notes "Validated candidate at $GITHUB_SHA."
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit "$tag" --draft=false --latest
