name: Editor Next Fast Build

on:
  push:
    branches:
      - teste/implementacao
  pull_request:
    branches:
      - main

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "test-secret-only-for-ci"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18
      - name: Install dependencies
        working-directory: apps/web
        run: bun install
      - name: Check HyperFrames worker JavaScript syntax
        run: node --check services/hyperframes/server.mjs
      - name: Test provider vault and timeline duration
        working-directory: apps/web
        run: bun test src/ai/config-store.test.ts src/hyperframes/intervals.test.ts
      - name: Next.js production compile and typecheck
        working-directory: apps/web
        run: bun run build
